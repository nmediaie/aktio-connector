name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: docker run --rm -v "$PWD":/app -w /app composer:2 install --no-interaction --ignore-platform-req=ext-*
      - run: npx wp-env start
      - run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/aktio-connector vendor/bin/phpunit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip.sh
      # Kopia o stałej nazwie: link „najnowsza wersja” z panelu Aktio
      # (releases/latest/download/aktio-connector.zip) nie zmienia się między wydaniami.
      - run: cp dist/aktio-connector-*.zip dist/aktio-connector.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aktio-connector-*.zip
            dist/aktio-connector.zip
